# Builds the Nintendo 3DS port: sonic3air.3dsx (Homebrew Launcher) and sonic3air.cia (install with FBI).
# Download the results from the "Actions" tab -> latest run -> "Artifacts" -> sonic3air-3ds.
# Pushing a version tag (e.g. "git tag v0.1.0 && git push origin v0.1.0") also publishes a GitHub Release
# with the CIA, 3DSX and the Universal-Updater store file (see Oxygen/sonic3air/build/_3ds/universal-updater/).
#
# The game data and the ROM are NOT part of the build; see Oxygen/sonic3air/build/_3ds/how-to-build.md

name: 3DS build

on:
  push:
    branches: [ 3ds-port, 3ds-gpu-drawer ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned versions of the CIA packaging tools
  MAKEROM_REPO: https://github.com/3DSGuy/Project_CTR.git
  MAKEROM_COMMIT: d52c2b0e788c2d085763d7c5dcc4b2edd9ffb7d8
  BANNERTOOL_REPO: https://github.com/carstene1ns/3ds-bannertool.git
  BANNERTOOL_COMMIT: 734d33be79fd3f8c29c6296158f06ac7c5ca9dcb

jobs:
  build-3ds:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake git ca-certificates

      - name: Build sonic3air.3dsx
        working-directory: Oxygen/sonic3air/build/_3ds
        run: |
          # Build label, shown in the game, by FBI and in the file names: "<tag>-b<number>" for releases, otherwise "b<number>-<commit>".
          # The build number (workflow run number) increases with every build and becomes the CIA's title version.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then BUILD_LABEL="$GITHUB_REF_NAME-b$GITHUB_RUN_NUMBER"; else BUILD_LABEL="b$GITHUB_RUN_NUMBER-$(echo "$GITHUB_SHA" | cut -c1-7)"; fi
          echo "BUILD_LABEL=$BUILD_LABEL" >> "$GITHUB_ENV"
          /opt/devkitpro/portlibs/3ds/bin/arm-none-eabi-cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DS3AIR_3DS_BUILD_ID="$BUILD_LABEL"
          cmake --build build -j"$(nproc)"

      - name: Build makerom
        run: |
          mkdir -p "$RUNNER_TEMP/src/makerom" "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/src/makerom"
          git init -q && git remote add origin "$MAKEROM_REPO"
          git fetch -q --depth 1 origin "$MAKEROM_COMMIT" && git checkout -q FETCH_HEAD
          make -C makerom deps -j"$(nproc)"
          make -C makerom program -j"$(nproc)"
          cp makerom/bin/makerom "$RUNNER_TEMP/tools/"

      - name: Build bannertool
        run: |
          mkdir -p "$RUNNER_TEMP/src/bannertool" && cd "$RUNNER_TEMP/src/bannertool"
          git init -q && git remote add origin "$BANNERTOOL_REPO"
          git fetch -q --depth 1 origin "$BANNERTOOL_COMMIT" && git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          cp build/bannertool "$RUNNER_TEMP/tools/"

      - name: Package sonic3air.cia
        working-directory: Oxygen/sonic3air/build/_3ds
        run: TOOLS_DIR="$RUNNER_TEMP/tools" BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./build-cia.sh

      - name: Build Universal-Updater icon sheet
        working-directory: Oxygen/sonic3air/build/_3ds
        run: /opt/devkitpro/tools/bin/tex3ds --atlas -f rgba8888 -z auto -o build/sonic3air-3ds.t3x icon.png

      - name: Name files by build
        working-directory: Oxygen/sonic3air/build/_3ds
        run: |
          mkdir -p build/out
          cp build/sonic3air.cia "build/out/sonic3air-$BUILD_LABEL.cia"
          cp build/sonic3air.3dsx "build/out/sonic3air-$BUILD_LABEL.3dsx"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: sonic3air-3ds-${{ env.BUILD_LABEL }}
          path: |
            Oxygen/sonic3air/build/_3ds/build/out/sonic3air-${{ env.BUILD_LABEL }}.cia
            Oxygen/sonic3air/build/_3ds/build/out/sonic3air-${{ env.BUILD_LABEL }}.3dsx
            Oxygen/sonic3air/build/_3ds/build/sonic3air-3ds.t3x
            Oxygen/sonic3air/build/_3ds/modpatcher/s3air_3ds_modpatcher.py
            Oxygen/sonic3air/build/_3ds/INSTALL.md
            Oxygen/sonic3air/build/_3ds/how-to-build.md
          if-no-files-found: error

  # The mod patcher as a Windows program, with Python built in: no need to install Python to use it
  modpatcher-exe:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build s3air_3ds_modpatcher.exe
        working-directory: Oxygen/sonic3air/build/_3ds/modpatcher
        run: |
          python -m pip install --upgrade pyinstaller==6.11.1 pillow
          python -m PyInstaller --onefile --windowed --name s3air_3ds_modpatcher --icon ../icon.png s3air_3ds_modpatcher.py

      - name: Upload the program
        uses: actions/upload-artifact@v4
        with:
          name: sonic3air-3ds-modpatcher-exe
          path: Oxygen/sonic3air/build/_3ds/modpatcher/dist/s3air_3ds_modpatcher.exe
          if-no-files-found: error

  # Publishes a GitHub Release for version tags. Universal-Updater installs from the latest release.
  release:
    needs: [ build-3ds, modpatcher-exe ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          pattern: sonic3air-3ds-*
          merge-multiple: true
          path: dist

      - name: Use fixed file names for the release (the store and the install guide refer to these)
        run: |
          cp dist/build/out/sonic3air-*.cia dist/sonic3air.cia
          cp dist/build/out/sonic3air-*.3dsx dist/sonic3air.3dsx

      - name: Create Universal-Updater store file
        run: |
          python3 Oxygen/sonic3air/build/_3ds/universal-updater/make_unistore.py --repo "$GITHUB_REPOSITORY" \
            --version "$GITHUB_REF_NAME" --revision "$GITHUB_RUN_NUMBER" --sheet --output dist/sonic3air-3ds.unistore

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Unofficial New 3DS / New 2DS XL port of Sonic 3 - Angel Island Revisited.

          **Before playing**, see INSTALL.md below: you need the \`data\` folder of A.I.R. **26.03.28.0** from sonic3air.org
          and your own Sonic 3 & Knuckles ROM from Steam, named exactly \`Sonic_Knuckles_wSonic3.bin\`,
          both in \`sdmc:/3ds/sonic3air/\`. No game content is included here.

          - \`sonic3air.cia\`: install with FBI (recommended)
          - \`sonic3air.3dsx\`: for the Homebrew Launcher
          - \`s3air_3ds_modpatcher.exe\`: sets up the game files and installs mods with the SD card in a Windows PC
            (no Python needed; \`s3air_3ds_modpatcher.py\` is the same for macOS / Linux with Python 3)
          - \`sonic3air-3ds.unistore\`: Universal-Updater store, add it via
            https://github.com/$GITHUB_REPOSITORY/releases/latest/download/sonic3air-3ds.unistore
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Sonic 3 A.I.R. for New 3DS $GITHUB_REF_NAME" --notes-file notes.md \
            dist/sonic3air.cia dist/sonic3air.3dsx dist/build/sonic3air-3ds.t3x \
            dist/sonic3air-3ds.unistore dist/INSTALL.md dist/modpatcher/s3air_3ds_modpatcher.py dist/s3air_3ds_modpatcher.exe

  # Publishes every build of the development branch as the rolling "test-build" pre-release (replacing the previous one),
  # with its own Universal-Updater store at a fixed URL:
  #   https://github.com/<repo>/releases/download/test-build/sonic3air-3ds-test.unistore
  test-release:
    needs: [ build-3ds, modpatcher-exe ]
    if: github.ref == 'refs/heads/3ds-gpu-drawer'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: test-release
      cancel-in-progress: false

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          pattern: sonic3air-3ds-*
          merge-multiple: true
          path: dist

      - name: Prepare release files
        run: |
          cp dist/build/out/sonic3air-*.cia dist/sonic3air.cia
          cp dist/build/out/sonic3air-*.3dsx dist/sonic3air.3dsx
          LABEL=$(basename dist/build/out/sonic3air-*.cia .cia | sed 's/^sonic3air-//')
          echo "LABEL=$LABEL" >> "$GITHUB_ENV"
          python3 Oxygen/sonic3air/build/_3ds/universal-updater/make_unistore.py --channel test --repo "$GITHUB_REPOSITORY" \
            --version "$LABEL" --revision "$GITHUB_RUN_NUMBER" --sheet --output dist/sonic3air-3ds-test.unistore

      - name: Replace the test-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          **Test build $LABEL** of the unofficial New 3DS port of Sonic 3 A.I.R. (development branch, may be unstable).
          Replaced automatically with every new build.

          Needs the \`data\` folder of A.I.R. **26.03.28.0** and your own Sonic 3 & Knuckles ROM from Steam in \`sdmc:/3ds/sonic3air/\`,
          see INSTALL.md. No game content is included here.

          Universal-Updater test store: https://github.com/$GITHUB_REPOSITORY/releases/download/test-build/sonic3air-3ds-test.unistore
          EOF
          gh release delete test-build --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create test-build --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Test build $LABEL" --notes-file notes.md \
            dist/sonic3air.cia dist/sonic3air.3dsx dist/build/sonic3air-3ds.t3x \
            dist/sonic3air-3ds-test.unistore dist/INSTALL.md dist/modpatcher/s3air_3ds_modpatcher.py dist/s3air_3ds_modpatcher.exe
